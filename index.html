<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3ef" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta
      name="description"
      content="Pointez vos heures, vérifiez votre fiche de paie, préparez une réclamation. Tout reste sur votre téléphone."
    />
    <title>Paie Juste — pointer, vérifier, réclamer</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div class="demo-banner" role="note">
      <div>MODE EXEMPLE — DONNÉES FICTIVES</div>
      <button type="button" id="quit-demo" class="demo-quit">✖ Quitter l'exemple</button>
    </div>
    <header class="top">
      <div class="logo" aria-hidden="true">PJ</div>
      <div class="brand"><b>Paie Juste</b><span>Noter · vérifier · réclamer</span></div>
      <span class="seal-pill" id="seal-pill" title="État de la chaîne d'empreintes">…</span>
      <button class="icon-btn" id="btn-data" aria-label="Données, export, exemple">⋯</button>
    </header>
    <main id="main"></main>
    <nav class="tabs" id="tabs" aria-label="Onglets"></nav>
    <dialog id="dlg"></dialog>
    <div id="toast" hidden role="status"></div>
    <div id="print-area"></div>
    <noscript><p class="note">Paie Juste a besoin de JavaScript. Tout reste sur votre téléphone.</p></noscript>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
